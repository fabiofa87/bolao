server {
    listen ${PORT};
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;
    proxy_ssl_server_name on;

    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 "window.__APP_CONFIG__ = { apiBaseUrl: '${API_BASE_URL}', backendScheme: '${BACKEND_SCHEME}', backendUrl: '${BACKEND_URL}', adminUrl: '${ADMIN_URL}' };";
    }

    location /api/ {
        proxy_pass ${BACKEND_SCHEME}://${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto ${FORWARDED_PROTO};
    }

    location = /admin {
        return 302 ${BACKEND_SCHEME}://${BACKEND_URL}/admin/;
    }

    location /admin/ {
        return 302 ${BACKEND_SCHEME}://${BACKEND_URL}$request_uri;
    }

    location /static/ {
        proxy_pass ${BACKEND_SCHEME}://${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto ${FORWARDED_PROTO};
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

